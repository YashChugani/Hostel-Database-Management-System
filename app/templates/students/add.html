{% extends 'base.html' %}
{% block content %}
<h2>Add Student</h2>
<form method="POST" class="row g-3">
  <div class="col-md-6"><label>Name</label><input type="text" name="name" class="form-control" required></div>
  <div class="col-md-6"><label>Email</label><input type="email" name="email" class="form-control" required></div>
  <div class="col-md-6"><label>Phone</label><input type="text" name="phone" class="form-control" required></div>
  <div class="col-md-6"><label>Gender</label>
    <select name="gender" class="form-select" required>
      <option>Male</option>
      <option>Female</option>
      <option>Others</option>
    </select>
  </div>
  <div class="col-md-12"><label>Address</label><input type="text" name="address" class="form-control"></div>
  <div class="col-md-6"><label>DOB</label><input type="date" name="dob" class="form-control"></div>
  <div class="col-md-6"><label>Course</label><input type="text" name="course" class="form-control"></div>
  <div class="col-md-6"><label>Year</label><input type="number" name="year" class="form-control"></div>
  <div class="col-12"><button class="btn btn-success">Save</button> <a href="{{ url_for('main.list_students') }}" class="btn btn-secondary">Cancel</a></div>
</form>
{% endblock %}
