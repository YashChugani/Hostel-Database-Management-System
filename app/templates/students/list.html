{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Students</h2>
  <a href="{{ url_for('main.add_student') }}" class="btn btn-primary">➕ Add Student</a>
</div>

<table class="table table-bordered table-striped">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Gender</th>
      <th>Course</th>
      <th>Year</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for s in students %}
    <tr>
      <td>{{ s.StudentID }}</td>
      <td>{{ s.StudentName }}</td>
      <td>{{ s.Email }}</td>
      <td>{{ s.Phone }}</td>
      <td>{{ s.Gender }}</td>
      <td>{{ s.Course }}</td>
      <td>{{ s.Year }}</td>
      <td>
        <a href="{{ url_for('main.edit_student', id=s.StudentID) }}" class="btn btn-sm btn-warning">✏️ Edit</a>
        <a href="{{ url_for('main.delete_student', id=s.StudentID) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this student?')">🗑 Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
