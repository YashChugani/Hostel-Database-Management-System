{% extends 'base.html' %}
{% block content %}
<h2>Edit Student</h2>
<form method="POST" class="row g-3">
  <div class="col-md-6"><label>Name</label><input type="text" name="name" class="form-control" value="{{ student.StudentName }}" required></div>
  <div class="col-md-6"><label>Email</label><input type="email" name="email" class="form-control" value="{{ student.Email }}" required></div>
  <div class="col-md-6"><label>Phone</label><input type="text" name="phone" class="form-control" value="{{ student.Phone }}" required></div>
  <div class="col-md-6"><label>Gender</label>
    <select name="gender" class="form-select" required>
      <option {% if student.Gender == 'Male' %}selected{% endif %}>Male</option>
      <option {% if student.Gender == 'Female' %}selected{% endif %}>Female</option>
      <option {% if student.Gender == 'Others' %}selected{% endif %}>Others</option>
    </select>
  </div>
  <div class="col-md-12"><label>Address</label><input type="text" name="address" class="form-control" value="{{ student.Address }}"></div>
  <div class="col-md-6"><label>DOB</label><input type="date" name="dob" class="form-control" value="{{ student.DOB }}"></div>
  <div class="col-md-6"><label>Course</label><input type="text" name="course" class="form-control" value="{{ student.Course }}"></div>
  <div class="col-md-6"><label>Year</label><input type="number" name="year" class="form-control" value="{{ student.Year }}"></div>
  <div class="col-12"><button class="btn btn-success">Update</button> <a href="{{ url_for('main.list_students') }}" class="btn btn-secondary">Cancel</a></div>
</form>
{% endblock %}
