{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4 fw-bold text-center">📊 Dashboard Overview</h2>

  <!-- Metric Cards -->
  <div class="row g-4">
    {% for label, value in data.items() %}
    <div class="col-md-4 col-lg-3">
      <div class="card text-center shadow-sm h-100 border-0">
        <div class="card-body">
          <h6 class="card-title text-muted text-uppercase">{{ label }}</h6>
          <h3 class="fw-bold text-primary">{{ value }}</h3>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- First Row of Charts -->
  <div class="row mt-5">
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">🏨 Rooms per Hostel</div>
        <div class="card-body" style="overflow-x:auto;">
          <canvas id="roomsChart" style="min-width:500px; height:300px;"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">👩‍🎓 Students per Hostel</div>
        <div class="card-body">
          <canvas id="studentsChart" height="300"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Second Row of Charts -->
  <div class="row mt-4">
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">💰 Fees Status</div>
        <div class="card-body">
          <canvas id="feesChart" height="300"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">📝 Complaint Status</div>
        <div class="card-body">
          <canvas id="complaintsChart" height="300"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Third Row of Charts -->
  <div class="row mt-4">
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">👨‍💼 Staff Roles</div>
        <div class="card-body">
          <canvas id="staffChart" height="300"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">🏠 Allocations per Room</div>
        <div class="card-body" style="overflow-x:auto;">
          <canvas id="allocationsChart" style="min-width:500px; height:300px;"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer / bottom message -->
  <div class="text-center mt-4">
    🎉 End of Dashboard 🎉
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const chartOptions = { responsive: true };

  // Rooms per Hostel (scrollable)
  new Chart(document.getElementById('roomsChart'), {
    type: 'bar',
    data: {
      labels: {{ rooms_per_hostel | map(attribute=0) | list | tojson }},
      datasets: [{
        label: 'Rooms',
        data: {{ rooms_per_hostel | map(attribute=1) | list | tojson }},
        backgroundColor: 'rgba(54, 162, 235, 0.6)',
        borderColor: 'rgba(54, 162, 235, 1)',
        borderWidth: 1
      }]
    },
    options: { ...chartOptions, scales: { y: { beginAtZero: true } } }
  });

  // Students per Hostel
  new Chart(document.getElementById('studentsChart'), {
    type: 'pie',
    data: {
      labels: {{ students_per_hostel | map(attribute=0) | list | tojson }},
      datasets: [{
        label: 'Students',
        data: {{ students_per_hostel | map(attribute=1) | list | tojson }},
        backgroundColor: ['#FF6384','#4BC0C0','#FFCE56','#9966FF','#FF9F40']
      }]
    },
    options: chartOptions
  });

  // Fees Status
  new Chart(document.getElementById('feesChart'), {
    type: 'doughnut',
    data: {
      labels: {{ fee_status_data | map(attribute=0) | list | tojson }},
      datasets: [{
        data: {{ fee_status_data | map(attribute=1) | list | tojson }},
        backgroundColor: ['#4BC0C0','#FF6384','#FFCE56']
      }]
    },
    options: chartOptions
  });

  // Complaint Status
  new Chart(document.getElementById('complaintsChart'), {
    type: 'doughnut',
    data: {
      labels: {{ complaint_status_data | map(attribute=0) | list | tojson }},
      datasets: [{
        data: {{ complaint_status_data | map(attribute=1) | list | tojson }},
        backgroundColor: ['#FF6384','#FFCE56','#4BC0C0']
      }]
    },
    options: chartOptions
  });

  // Staff Roles
  new Chart(document.getElementById('staffChart'), {
    type: 'pie',
    data: {
      labels: {{ staff_roles_data | map(attribute=0) | list | tojson }},
      datasets: [{
        data: {{ staff_roles_data | map(attribute=1) | list | tojson }},
        backgroundColor: ['#FF6384','#36A2EB','#FFCE56']
      }]
    },
    options: chartOptions
  });

  // Allocations per Room (scrollable)
  new Chart(document.getElementById('allocationsChart'), {
    type: 'bar',
    data: {
      labels: {{ allocations_per_room | map(attribute=0) | list | tojson }},
      datasets: [{
        label: 'Allocations',
        data: {{ allocations_per_room | map(attribute=1) | list | tojson }},
        backgroundColor: 'rgba(153, 102, 255, 0.6)',
        borderColor: 'rgba(153, 102, 255, 1)',
        borderWidth: 1
      }]
    },
    options: { ...chartOptions, scales: { y: { beginAtZero: true } } }
  });

});
</script>
{% endblock %}
